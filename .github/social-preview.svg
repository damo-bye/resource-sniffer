  <circle cx="1180" cy="540" r="100" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="500" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1080" cy="140" r="70" fill="rgba(255,255,255,0.08)"/>

