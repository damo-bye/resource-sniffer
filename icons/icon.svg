<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="white" stroke-width="4"/>

  <!-- 搜索图标 -->
  <circle cx="52" cy="52" r="20" fill="none" stroke="white" stroke-width="6"/>
  <line x1="66" y1="66" x2="85" y2="85" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- 下载箭头 -->
  <line x1="64" y1="75" x2="64" y2="100" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polyline points="50,88 64,100 78,88" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 装饰元素 -->
  <circle cx="35" cy="35" r="4" fill="white" opacity="0.8"/>
  <circle cx="93" cy="35" r="4" fill="white" opacity="0.8"/>
  <circle cx="35" cy="93" r="4" fill="white" opacity="0.8"/>
</svg>
